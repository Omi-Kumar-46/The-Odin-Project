<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="calculator.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="cal-body">
        <p></p>

        <div id="button-layout">
            <button id="ac">AC</button>
            <button id="percent">%</button>
            <button id="delete">⌫</button>
            <button id="/" class="operation orange">÷</button>

            <button id="7" class="digit">7</button>
            <button id="8" class="digit">8</button>
            <button id="9" class="digit">9</button>
            <button id="*" class="operation orange">x</button>

            <button id="4" class="digit">4</button>
            <button id="5" class="digit">5</button>
            <button id="6" class="digit">6</button>
            <button id="-" class="operation orange">-</button>

            <button id="1" class="digit">1</button>
            <button id="2" class="digit">2</button>
            <button id="3" class="digit">3</button>
            <button id="+" class="operation orange">+</button>

            <button id="0" class="digit">0</button>
            <button id=".">•</button>
            <button id="negation">+/-</button>
            <button id="=" class="orange">=</button>

        </div>
    </div>
</body>

</html>
