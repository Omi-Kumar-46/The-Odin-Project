<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <script src="grid.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div id="app">
            <h1>Etch-a-Sketch</h1>
            <div id="toolkit">
                <input type="number" id="sizeInput" name="sizeInput" value="16" min="1" max="100"
                    placeholder="Enter Grid Size">
                <button id="resize-btn">Resize</button>
                <button id="clear-btn">Clear</button>
                <button id="eraser-btn">Eraser</button>
                <label for="colorPicker">Color:</label>
                <input type="color" id="colorPicker" name="colorPicker" value="#8cf0ff">
                <label for="randomColor">Random Color Mode</label>
                <input type="checkbox" id="randomColor">
            </div>

            <div id="wrapper">
                <div id="container">
                </div>
            </div>
    </main>


</body>

</html>
